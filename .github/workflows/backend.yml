name: PayO Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Show GitHub Repository Information
      # ==========================================================
      - name: Show GitHub Repository Information
        run: |
          echo "=========================================="
          echo "GitHub Repository Information"
          echo "=========================================="
          echo "Repository       : $GITHUB_REPOSITORY"
          echo "Repository ID    : $GITHUB_REPOSITORY_ID"
          echo "Repository Owner : $GITHUB_REPOSITORY_OWNER"
          echo "Owner ID         : $GITHUB_REPOSITORY_OWNER_ID"
          echo "Branch/Ref       : $GITHUB_REF"
          echo "Commit           : $GITHUB_SHA"
          echo "=========================================="

      # ==========================================================
      # 3. Show Repository Structure
      # ==========================================================
      - name: Show Repository Files
        run: |
          echo "=========================================="
          echo "Repository Structure"
          echo "=========================================="
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      # ==========================================================
      # 4. Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json

      # ==========================================================
      # 5. Verify Backend Files
      # ==========================================================
      - name: Verify Backend Files
        working-directory: src
        run: |
          echo "=========================================="
          echo "Checking Backend Files"
          echo "=========================================="

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found."
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found."
            exit 1
          fi

          echo "package.json found."
          echo "package-lock.json found."
          echo "Dockerfile found."

      # ==========================================================
      # 6. Install Dependencies
      # ==========================================================
      - name: Install Dependencies
        working-directory: src
        run: |
          npm ci

      # ==========================================================
      # 7. Inspect GitHub OIDC Claims
      # ==========================================================
      # TEMPORARY DIAGNOSTIC STEP
      # Remove this step after OIDC authentication is confirmed.
      - name: Inspect GitHub OIDC Claims
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Requesting GitHub OIDC Token"
          echo "=========================================="

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain GitHub OIDC token."
            exit 1
          fi

          echo "OIDC token received successfully."

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          MOD=$(( ${#PAYLOAD} % 4 ))

          if [ "$MOD" -eq 2 ]; then
            PAYLOAD="${PAYLOAD}=="
          elif [ "$MOD" -eq 3 ]; then
            PAYLOAD="${PAYLOAD}="
          fi

          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          if [ -z "$CLAIMS" ]; then
            echo "ERROR: Could not decode OIDC claims."
            exit 1
          fi

          echo "=========================================="
          echo "Actual GitHub OIDC Claims"
          echo "=========================================="

          echo "$CLAIMS" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            workflow
          }'

          echo "=========================================="

      # ==========================================================
      # 8. Configure AWS Using GitHub OIDC
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-PAYO-Backend
          aws-region: ${{ secrets.AWS_REGION }}

      # ==========================================================
      # 9. Verify AWS Authentication
      # ==========================================================
      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="

      # ==========================================================
      # 10. Login to Amazon ECR
      # ==========================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================================
      # 11. Verify ECR Repository
      # ==========================================================
      - name: Verify ECR Repository
        run: |
          echo "=========================================="
          echo "Checking ECR Repository"
          echo "=========================================="

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # ==========================================================
      # 12. Build Docker Image
      # ==========================================================
      - name: Build Docker Image
        working-directory: src
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "=========================================="
          echo "Building Backend Docker Image"
          echo "=========================================="

          echo "Image URI: $IMAGE_URI"
          echo "Commit: $GITHUB_SHA"

          docker build \
            -t "$IMAGE_URI:$GITHUB_SHA" \
            -t "$IMAGE_URI:latest" \
            .

      # ==========================================================
      # 13. Push Docker Image to ECR
      # ==========================================================
      - name: Push Docker Image to ECR
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "=========================================="
          echo "Pushing Backend Image to ECR"
          echo "=========================================="

          docker push "$IMAGE_URI:$GITHUB_SHA"
          docker push "$IMAGE_URI:latest"

          echo "=========================================="
          echo "Docker Images Pushed Successfully"
          echo "=========================================="

      # ==========================================================
      # 14. Update EKS Kubeconfig
      # ==========================================================
      - name: Update kubeconfig
        run: |
          echo "=========================================="
          echo "Updating EKS Kubeconfig"
          echo "=========================================="

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ==========================================================
      # 15. Verify Kubernetes Access
      # ==========================================================
      - name: Verify Kubernetes Access
        run: |
          echo "=========================================="
          echo "EKS Cluster Information"
          echo "=========================================="

          kubectl cluster-info

          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes

          echo "=========================================="
          echo "Kubernetes Namespace"
          echo "=========================================="

          kubectl get namespace "$KUBE_NAMESPACE"

      # ==========================================================
      # 16. Verify Backend Deployment
      # ==========================================================
      - name: Verify Backend Deployment
        run: |
          echo "=========================================="
          echo "Checking payo-backend Deployment"
          echo "=========================================="

          if kubectl get deployment payo-backend \
            -n "$KUBE_NAMESPACE" > /dev/null 2>&1; then

            echo "payo-backend deployment found."

          else

            echo "ERROR: payo-backend deployment was not found."
            exit 1

          fi

      # ==========================================================
      # 17. Deploy Backend Image to EKS
      # ==========================================================
      - name: Deploy Backend to Amazon EKS
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "=========================================="
          echo "Deploying Backend to EKS"
          echo "=========================================="

          echo "Deployment : payo-backend"
          echo "Namespace  : $KUBE_NAMESPACE"
          echo "Image      : $IMAGE_URI:$GITHUB_SHA"

          kubectl set image deployment/payo-backend \
            payo-backend="$IMAGE_URI:$GITHUB_SHA" \
            -n "$KUBE_NAMESPACE"

      # ==========================================================
      # 18. Verify Deployment Rollout
      # ==========================================================
      - name: Verify Rollout
        run: |
          echo "=========================================="
          echo "Waiting for Backend Rollout"
          echo "=========================================="

          kubectl rollout status deployment/payo-backend \
            -n "$KUBE_NAMESPACE" \
            --timeout=300s

      # ==========================================================
      # 19. Display Kubernetes Resources
      # ==========================================================
      - name: Display Kubernetes Resources
        run: |
          echo "=========================================="
          echo "Deployments"
          echo "=========================================="

          kubectl get deployments \
            -n "$KUBE_NAMESPACE"

          echo "=========================================="
          echo "Pods"
          echo "=========================================="

          kubectl get pods \
            -o wide \
            -n "$KUBE_NAMESPACE"

          echo "=========================================="
          echo "Services"
          echo "=========================================="

          kubectl get svc \
            -n "$KUBE_NAMESPACE"

      # ==========================================================
      # 20. Deployment Summary
      # ==========================================================
      - name: Deployment Summary
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "=========================================="
          echo "PAYO BACKEND DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Repository  : $GITHUB_REPOSITORY"
          echo "Commit      : $GITHUB_SHA"
          echo "AWS Region  : $AWS_REGION"
          echo "ECR Image   : $IMAGE_URI:$GITHUB_SHA"
          echo "EKS Cluster : $EKS_CLUSTER_NAME"
          echo "Namespace   : $KUBE_NAMESPACE"
          echo "Deployment   : payo-backend"
          echo "=========================================="
