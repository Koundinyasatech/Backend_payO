name: PAYO Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  KUBE_NAMESPACE: payo-prod

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Verify AWS
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 6. Login to ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Create image tag
      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_URI" \
            .

      # 9. Push image
      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      # 10. Update kubeconfig
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # 11. Verify EKS
      - name: Verify EKS
        run: |
          kubectl get nodes
          kubectl get namespace "$KUBE_NAMESPACE"

      # 12. Create namespace if required
      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$KUBE_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 13. Apply backend deployment
      - name: Deploy backend
        run: |
          kubectl apply -f src/payo-backend/k8s/deployment.yaml
          kubectl apply -f src/payo-backend/k8s/service.yaml

      # 14. Update image
      - name: Update backend image
        run: |
          kubectl set image deployment/payo-backend \
            payo-backend="$IMAGE_URI" \
            -n "$KUBE_NAMESPACE"

      # 15. Check rollout
      - name: Check deployment
        run: |
          kubectl rollout status deployment/payo-backend \
            -n "$KUBE_NAMESPACE" \
            --timeout=180s

      # 16. Display resources
      - name: Show backend resources
        if: always()
        run: |
          kubectl get deployment -n "$KUBE_NAMESPACE"
          kubectl get pods -n "$KUBE_NAMESPACE" -o wide
          kubectl get svc -n "$KUBE_NAMESPACE"
